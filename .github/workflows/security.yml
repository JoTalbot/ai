name: Security and scheduled verification

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Dependency audit and full verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install project and audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pip-audit
      - name: Audit installed dependencies
        run: pip-audit
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        run: pytest
